name: Skill validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        if: matrix.python != '3.9' || runner.os == 'macOS'
        with:
          python-version: ${{ matrix.python }}
      # Ubuntu 26.04 has no setup-python 3.9 build. Keep the Linux and Windows
      # 3.9 jobs on the same patched CPython without changing the test suite.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: matrix.python == '3.9' && runner.os != 'macOS'
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Install CPython 3.9 on Ubuntu
        if: matrix.python == '3.9' && runner.os == 'Linux'
        shell: bash
        run: |
          uv venv --python 3.9.25 --managed-python --seed "$RUNNER_TEMP/wtg-python39"
          echo "$RUNNER_TEMP/wtg-python39/bin" >> "$GITHUB_PATH"
      - name: Install CPython 3.9 on Windows
        if: matrix.python == '3.9' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = Join-Path $env:RUNNER_TEMP 'wtg-python39'
          uv venv --python 3.9.25 --managed-python --seed $runtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $runtime 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - run: python -m pip install Pillow==11.3.0
      - name: Run the Windows installation checker
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $reportText = & .\want-to-go-trip-planner\scripts\doctor_windows.ps1 -Locale zh-CN
          if ($LASTEXITCODE -ne 0) { throw "Windows checker exited with code $LASTEXITCODE" }
          $doctor = ($reportText -join [Environment]::NewLine) | ConvertFrom-Json
          if ($doctor.platform.name -ne "Windows" -or -not $doctor.coreReady) {
            throw "Windows checker did not report a ready core runtime"
          }
          Write-Output ("Windows checker status: " + $doctor.status)
      - run: python -m unittest discover -s tests
      - run: python want-to-go-trip-planner/scripts/build_release.py --zip dist/want-to-go-trip-planner-skill-3.2.1.zip
      - run: git diff --exit-code -- want-to-go-trip-planner/release-manifest.json
      - run: python want-to-go-trip-planner/scripts/want_to_go.py scan --path dist/want-to-go-trip-planner-skill-3.2.1.zip --mode package
