name: Windows validation

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/want-to-go-v2
      - codex/want-to-go-v2-3-visual
      - codex/want-to-go-v2-4-platforms
      - codex/want-to-go-v2-4-audit
    tags:
      - v2.4.3

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # immutable v5 commit
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # immutable v4 commit
        with:
          node-version: "22"

      - name: Install runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          npm install --global @jackwener/opencli@1.8.6
          choco install tesseract --version=5.5.3.20260724 --no-progress --yes
          choco install ffmpeg --version=8.1.2 --no-progress --yes
          $env:PATH = "C:\Program Files\Tesseract-OCR;C:\ProgramData\chocolatey\bin;$env:PATH"
          $languageFile = "C:\Program Files\Tesseract-OCR\tessdata\chi_sim.traineddata"
          if (-not (Test-Path $languageFile)) {
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/87416418657359cb625c412a48b6e1d6d41c29bd/chi_sim.traineddata" -OutFile $languageFile
          }
          $languageHash = (Get-FileHash $languageFile -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($languageHash -ne "a5fcb6f0db1e1d6d8522f39db4e848f05984669172e584e8d76b6b3141e1f730") {
            throw "chi_sim.traineddata SHA-256 mismatch"
          }
          "C:\Program Files\Tesseract-OCR" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run Windows doctor
        shell: powershell
        run: |
          $doctorOutput = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\skills\want-to-go-trip-planner\scripts\doctor_windows.ps1 -Locale en-US
          $doctorExitCode = $LASTEXITCODE
          $doctorOutput | Out-File -FilePath windows-doctor.json -Encoding utf8
          if ($doctorExitCode -ne 0) {
            throw "Windows doctor exited with code $doctorExitCode"
          }
          $report = Get-Content -Raw -Encoding utf8 windows-doctor.json | ConvertFrom-Json
          if ($report.status -ne "ready" -or -not $report.fullReady) {
            throw "Windows doctor did not reach ready/fullReady"
          }

      - name: Run full regression suite
        shell: pwsh
        run: python -m unittest tests.test_public_skill

      - name: Check renderer and release package
        shell: pwsh
        run: |
          node --check skills/want-to-go-trip-planner/renderer/render_report.mjs
          python skills/want-to-go-trip-planner/scripts/build_release.py --verify --zip dist/want-to-go-trip-planner-skill-2.4.3.zip
          python skills/want-to-go-trip-planner/scripts/want_to_go.py scan --path dist/want-to-go-trip-planner-skill-2.4.3.zip --mode package
          python skills/want-to-go-trip-planner/scripts/want_to_go.py scan --path dist/want-to-go-trip-planner-v2.4.3-preview.html --mode customer
          $zip = Get-FileHash dist/want-to-go-trip-planner-skill-2.4.3.zip -Algorithm SHA256
          $zip.Hash | Out-File -FilePath windows-zip-sha256.txt -Encoding ascii

      - name: Attest release provenance
        if: startsWith(github.ref, 'refs/tags/v2.4.3')
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/want-to-go-trip-planner-skill-2.4.3.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: want-to-go-trip-planner-v2.4.3-windows-validated
          path: |
            dist/want-to-go-trip-planner-skill-2.4.3.zip
            dist/want-to-go-trip-planner-skill-2.4.3.zip.sha256
            windows-doctor.json
            windows-zip-sha256.txt
          if-no-files-found: error
          retention-days: 14
